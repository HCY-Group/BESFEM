name: Build and deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # The Jekyll Docker action creates files owned by root.
      - name: Make website output writable by the runner
        run: sudo chown -R "$(id -u):$(id -g)" _site

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen graphviz

      # Generate separately so committed API files cannot leave stale pages.
      - name: Generate API documentation
        run: |
          { cat Doxyfile; printf '\nOUTPUT_DIRECTORY = %s/doxygen\n' "$RUNNER_TEMP"; } | doxygen -
          test -s "$RUNNER_TEMP/doxygen/api/index.html"
          rm -rf _site/api
          cp -a "$RUNNER_TEMP/doxygen/api" _site/api
          test -s _site/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
